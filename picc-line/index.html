        <script>
            var english={
                "title":"Getting a PICC Line",
                "line1":"This story is about getting a PICC Line.",
                "line2":"A PICC line is a small, flexible tube that stays in my arm. It helps my body get the special water and vitamins I need to feel strong!",
                "line3":"First, I will go to a room with a cozy bed. I can remember to take deep breaths to help me feel calm while waiting for the friendly doctors to arrive.",
                "line4":"Then I will meet the doctors. They might be wearing a blue hat, mask, and blue clothes called scrubs. They may ask me and my family questions. We can ask them questions too.",
                "line5":"The nurse will wash my arm with a cold sponge. Then they will put a paper 'tent' over my arm.",
                "line6":"The doctor will help me feel very relaxed. I might take a little nap, or they will use a cream to make my arm feel sleepy. My arm might feel heavy or numb, like it's fallen asleep.",
                "line7":"The doctor uses a special camera to look inside my arm. They will use some cool gel and a smooth wand. I can see black and white pictures on the screen.",
                "line8":"Next, the Doctor will place a rubber band on my arm.",
                "line9":"The doctor will gently slide a tube into my arm. I might feel a little pressure, but it won't be painful.",
                "line10":"When we are done, the nurse will put a clear, shiny sticker over my arm to keep the tube safe. They might also give me a soft, stretchy sleeve. Now my PICC line is all done, and I was super brave today!",
                "line11":"I did a great job learning how to get a PICC line!",
            }
             var capeverdeancreole={
                "title":"Colocação de um cateter PICC",
                "line1":"Es stória é sobre um colocação de um cateter PICC.",
                "line2":"Um cateter PICC é um pequeno tubo flexível ki fika dentru di nha braço. Es ta ajuda nha korpu a recebe água e vitaminas especias ki mi precisa pa mi sinti forte!",
                "line3":"Priméru, mi ta bai pa um quarto com uma cama konfortável. Mi pode lembra di respirá fundo pa ajudam fica calmu enquanto ta espera pa chegada de ques simpáticos médicos.",
                "line4":"Depois, nta konxi nhas médikus. Es pode sta ta usa chapéu azul, máscara, i roupas azul ki ta txoma uniformes cirúrgicos. Es pode fazi perguntas pa ami e nha família. Também nu pode fazes perguntas.",
                "line5":"Enfermeiru ta limpa nha braço ku un esponja friu. Depois és ta põe un “tenda” di papel sobri nha braço.",
                "line6":"Dotor ta ajudam a xinti bem relaxadu. Mi pode durmi un poku, ou és ta uza un creme pa deixa nha meu braço sonolento. Nha braço pode fica pesadu ou dormenti, komu si el tiver ta dormi.",
                "line7":"Doutor tá utiliza um câmara especial pa examina dentru di nha braço. Es ta usa um gel frio e uma sonda lisinhu. Mi pode odja imagen preto i branku na tela.",
                "line8":"Depois, doutor ta coloca um elástico na nha braço.",
                "line9":"Dotor ta mete un tubu gentilmenti dentru di nha braço. Mi pode sinti un poku pressão, ma ka ta ser dor.",
                "line10":"Quando nu termina, enfermeiru ta coloca um adesivo transparente e brilhante na nha braço para proteje quel tubo. Es pode também dam um capa macia e elástica. Gossi nha cateter PICC esta prontu e nfui super corajosa hoje!",
                "line11":"Mi fez un bom trabadju na aprendi modi qui ta colocado um cateter PICC!",
