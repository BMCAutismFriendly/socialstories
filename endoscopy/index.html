        <script>
            var english={
                "title":"Getting an Endoscopy",
                "line1":"This social story was developed by Dr. Mojdeh Mostafavi, a pediatric fellow in gastroenterology at Mass General Hospital for Children. Learn more by visiting https://www.massgeneral.org/children/gastroenterology.<br>This story is about how I can get an endoscopy. If I feel nervous, I can<ul><li>Think of something that makes me happy</li><li>Ask someone to hold my hand</li><li>Use calming exercises like counting</li></ul>",
                "line2":"To get ready for my test, I will need to have a special drink. The drink will help me poop. My belly might feel different, but it will not hurt.",
                "line3":"In the morning, I am going to wake up, but I am not going to eat or drink. I will still be able to have medicine.",
                "line4":"Then I will go to the hospital, check in, and wait until the nurses are ready to help me get ready in the examination room.",
                "line5":"The nurse in the room will check my weight, and after that I will take off all my clothes. They will give me a hospital gown to wear, and I may feel cold. If I am cold, I can use a warm blanket.",
                "line6":"Then the nurse will check my temperature. They may touch my face or arm with the thermometer, but it will not hurt. If I am nervous or uncomfortable, I can count to 20.",
                "line7":"The nurse will check my blood pressure after taking my temperature. They will wrap a band around my arm that will give me a big squeeze. It will not hurt. If I am nervous or uncomfortable, I can count to 20.",
                "line8":"The nurse will check my oxygen after by putting a clip on my finger that shines a red light. It will not hurt. If I am nervous or uncomfortable, I can count to 20.",
                "line9":"While I’m waiting, it is okay to feel nervous or scared. I will remind myself that I am safe and that there are nurses, doctors, and a child life specialist to all help take care of me. They will answer my questions, and the doctor may give me medicine to help me relax.",
                "line10":"To get ready for my test, I may go under anesthesia with an IV. For this, I will get an IV, which is a special straw that goes in my hand or arm. The doctor can give me special water and medicine through my IV. I am safe while using an IV.",
                "line11":"The nurse will push on my hand or arm. They will wrap a rubber band around my arm- it will feel tight. Then the nurse will clean my arm with a swab- this will feel cold and wet.",
                "line12":"The nurse will put the special straw in my arm using a needle. This will feel like a poke or sting, and it may hurt a little bit. If I am nervous or uncomfortable, I can count to 20. When this is done, the nurse will take the needle away.",
                "line13":"The nurse will put tape on the special tube. I will see blood coming out of my body, but my body will make more blood. I am safe.",
                "line14":"The nurse will connect the IV to special water or medicine. This will make me feel better! I will not touch or pull on my IV.",
                "line15":"I will go to the endoscopy room. There will be lots of machines in the room. It is okay to feel nervous or scared, but I will remind myself that I am safe and that the nurses and doctors will help me be comfortable. I will get medicine to make me fall asleep, and the doctor will do the endoscopy test. The endoscopy will not hurt.",
                "line16":"I may go under anesthesia by using a mask. For this, the doctor will give me a mask to put on my nose and mouth. It will feel squishy, and it will smell funny. I will take deep breaths in and out. I am safe.",
                "line17":"The doctor will give me medicine to wake me up. When I wake up, I may feel funny or tired. This will get better! The nurse will give me a drink and a snack.",
                "line18":"When my doctor says it is OK, I can go home! My throat might feel sore. I can have cold food and drinks. My throat will get better soon.",
                "line19":"I did a great job getting an endoscopy!",
            }
            var spanish={
                "title":"Vou Fazer uma Endoscopia",
                "line1":"This social story was developed by Dr. Mojdeh Mostafavi, a pediatric fellow in gastroenterology at Mass General Hospital for Children. Learn more by visiting https://www.massgeneral.org/children/gastroenterology.<br>Para me preparar para o exame, precisarei tomar uma bebida especial. A bebida me ajudará a fazer cocô. Minha barriga pode se sentir diferente. Não vai doer.",
                "line2":"Me voy a despertar por la mañana. No voy a comer ni a beber. Puedo tomar mi medicina.",
                "line3":"Conduciremos hasta el hospital. Entraremos caminando en el edificio. Iré a la sala de espera. Me registraré en recepción. Esperaré hasta que me llamen por mi nombre. Cuando me llamen por mi nombre, entraré a una habitación diferente. Allí estará un enfermero para ayudarme.",
                "line4":"El enfermero verificará mi peso. Me quitaré toda la ropa. Me pondré una bata de hospital. Es posible que sienta frío. Puedo usar una manta que me abrigue.",
                "line5":"El enfermero me tomará la temperatura. Es posible que el enfermero me toque la cara o el brazo con el termómetro. No me dolerá. Puedo contar hasta 20 y todo habrá terminado.",
                "line6":"El enfermero verificará mi presión arterial. El enfermero me colocará una banda alrededor del brazo que me dará un apretón fuerte. No me dolerá. Puedo contar hasta 20 y todo habrá terminado.",
                "line7":"El enfermero verificará mi oxígeno. El enfermero me colocará una pinza en el dedo que emitirá una luz roja. No me dolerá. Puedo contar hasta 20 y todo habrá terminado.",
                "line9":"Está bien sentirse nervioso o asustado. Estoy a salvo. Habrá enfermeros, médicos y un especialista en vida infantil para ayudar a cuidarme. Ellos responderán mis preguntas. Es posible que el médico me dé medicamentos que me ayuden a relajarme.",
                "line10":"Para prepararme para la prueba, me pondrán una vía intravenosa. Una vía intravenosa es una pajita especial que se coloca en la mano o en el brazo. El médico puede darme agua especial y medicamentos a través de mi vía intravenosa. Estoy a salvo.",
                "line11":"El enfermero presionará mi mano o mi brazo. El enfermero me colocará una banda elástica alrededor del brazo. Se sentirá apretada. El enfermero me limpiará el brazo con un hisopo. Se sentirá frío y húmedo.",
                "line12":"El enfermero colocará la pajita especial en mi brazo utilizando una aguja. Se sentirá como un pinchazo o una picadura. Es posible que duela un poquito. Puedo contar hasta 20 y todo habrá terminado. El enfermero retirará la aguja.",
                "line13":"El enfermero colocará cinta adhesiva sobre el tubo especial. Veré salir sangre de mi cuerpo. Mi cuerpo producirá más sangre. Estoy a salvo.",
                "line14":"El enfermero conectará la vía intravenosa a un agua especial o a medicamentos. Esto me hará sentir mejor. No tocaré ni tiraré de mi vía intravenosa.",
                "line15":"Iré a la sala de endoscopia. Habrá muchas máquinas en la sala. Está bien sentirse nervioso o asustado. Estoy a salvo. Los enfermeros y los médicos me ayudarán a estar cómodo. Se me administrará un medicamento para que me duerma. El médico realizará la prueba de endoscopia. La prueba de endoscopia no me dolerá.",
                "line16":"El médico me dará una mascarilla para colocármela sobre la nariz y la boca. Se sentirá esponjosa. Olerá extraño. Respiraré profundamente, inhalando y exhalando. Estoy a salvo.",
                "line17":"El médico me dará medicina para despertarme. Es posible que me sienta extraño o cansado. Esto mejorará. El enfermero me dará una bebida y un aperitivo.",
                "line18":"Cuando mi médico diga que está bien, podré irme a casa. Es posible que me duela la garganta. Puedo consumir alimentos y bebidas frías. Mi garganta mejorará pronto.",
                "line19":"¡Haré un gran trabajo haciéndome la endoscopia!",
            }
